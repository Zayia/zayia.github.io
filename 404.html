<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>404 · Zayia</title>
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1117'/%3E%3Ctext x='50' y='68' font-family='system-ui,sans-serif' font-size='54' font-weight='600' fill='%237dd3fc' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E" />
		<style>
			:root {
				--bg: #0d0f14;
				--text: #e6e9ef;
				--muted: #9aa3b2;
				--accent: #7dd3fc;
				--line: #232a38;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #f7f8fa;
					--text: #1b1f27;
					--muted: #5c6573;
					--accent: #0369a1;
					--line: #e3e6ec;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
				padding: 24px;
			}
			main {
				text-align: center;
				max-width: 30em;
			}
			.code {
				font-size: clamp(64px, 16vw, 120px);
				font-weight: 700;
				line-height: 1;
				letter-spacing: -0.04em;
				margin: 0;
				color: var(--accent);
			}
			p {
				color: var(--muted);
				margin: 14px 0 0;
			}
			a {
				display: inline-block;
				margin-top: 26px;
				padding: 9px 20px;
				border: 1px solid var(--line);
				border-radius: 999px;
				color: var(--text);
				text-decoration: none;
			}
			a:hover {
				border-color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main>
			<p class="code">404</p>
			<p>这个页面不存在，可能是链接过期了。</p>
			<a href="/">回到首页</a>
		</main>
	</body>
</html>
